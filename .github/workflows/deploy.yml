name: Deploy website to GitHub Pages

# Triggers on every push to main that touches the website folder, and can
# also be run manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deploys racing each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Deploys when pushed to razeenwasif/plantclef (the active R&D fork);
    # silently no-ops on any other remote (e.g. the frozen
    # ManindraDeMel/PlantCLEF2026 repo or any local mirror).
    if: github.repository == 'razeenwasif/plantclef'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        # Project page at razeenwasif.github.io/plantclef/ -> BASE_PATH must
        # match the repo slug so internal asset URLs resolve.
        env:
          BASE_PATH: /plantclef
        run: npm run build

      - name: Disable Jekyll on Pages
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    needs: build
    if: github.repository == 'razeenwasif/plantclef'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
