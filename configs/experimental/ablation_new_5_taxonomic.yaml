dataset:
  img_dir: data/mini_val_images
  test_csv: data/mini_val_inference.csv
inference:
  aggregation: mean
  batch_size: 128
  disable_logit_standardization: false
  num_workers: 8
  use_hflip_tta: false
  use_ttt: false
model:
  checkpoints:
  - path: models/lightweight_dinov3_latest.pth
    resolution: 224
  num_classes: 7806
  resolution: 224
output:
  species_mapping: /workspace/plantclef/processed/species_ids_mapping.csv
  submission_csv: submissions/ablation_new_5_taxonomic.csv
postprocess:
  fw_top_k: 5
  min_predictions: 1
  min_vegetation_frac: 0.0
  threshold: 0.05
  top_k: 5
  use_frank_wolfe: false
  use_geochem: false
  use_ising_model: false
  use_pav_calibration: false
  use_phenology: false
  use_taxon_filter: true
tiling:
  enabled: false
