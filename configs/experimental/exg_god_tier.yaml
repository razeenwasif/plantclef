# ORACLE: ExG-Bayesian "God-Tier" Ensemble (The Ultimate Winner Recipe)
# --------------------------------------------------
# This config activates "Physical Vegetation Weighting" (ExG).
# It suppresses model predictions in non-plant regions (dirt/rock/debris)
# by calculating the Excess Green (ExG) index of every tile.
# --------------------------------------------------

model:
  checkpoints:
    - path: "/workspace/working/best.pt"
      resolution: 512                # 0.38 LB Leader (Giant)
    - path: "/workspace/working/PlantCLEF2026/models/dinov3_plantnet_v2_retrain/phase_a_best.pth"
      resolution: 512                # 0.37 LB Retrain
    - path: "/workspace/working/PlantCLEF2026/models/dinov3_plantnet_v1_ddp/phase_b_best_ALIGNED.pth"
      resolution: 224                # 0.36 LB (Exp 008)
    - path: "models/cuda_deep_sat/expert_bioclip_512/epoch_ep2_final_MERGED.pth"
      resolution: 512                # New Specialist (Aligned + LoRA Merged)
    - path: "models/cuda_deep_sat/expert_dinov3_512/epoch_ep2_final_MERGED.pth"
      resolution: 512                # New Specialist (Aligned + LoRA Merged)
    - path: "models/cuda_deep_sat/oracle_s1337/phase2_checkpoint_ep7_step_final_ALIGNED_V2.pth"
      resolution: 448                # Salvaged Specialist
    - path: "models/cuda_deep_sat/oracle_s9999/swa_model_final_ALIGNED_V2.pth"
      resolution: 224                # Student Anchor

  num_classes:  7808
  resolution:   512
  bioclip:      "hf-hub:imageomics/bioclip-2"
  dinov3:       "vit_large_patch16_dinov3.lvd1689m"
  convnext:     "convnextv2_large.fcmae_ft_in22k_in1k_384"

dataset:
  test_csv:  "/workspace/plantclef/kaggle_uploads/test/PlantCLEF2025_test.csv"
  img_dir:   "/workspace/plantclef/processed/test_images_jpeg85_max800"

tiling:
  enabled:    true
  tile_size:  512
  overlap:    0.25                   
  scales:     [1.0, 0.7, 0.5]        

inference:
  batch_size:        64              
  num_workers:       16
  aggregation:       "bayesian_veg"  # ORACLE: Activate Physical + Certainty aggregation
  disable_logit_standardization: true
  ensemble_weights:  [0.20, 0.20, 0.15, 0.15, 0.15, 0.10, 0.05]
  
  use_hflip_tta:     true            
  use_ttt:           true            
  ttt_steps:         10

postprocess:
  threshold:                  0.3
  top_k:                      10
  min_predictions:            1
  
  # Physical Constraint: Ignore tiles with almost no greenery
  min_vegetation_frac:        0.15   

  use_pav_calibration:        true   
  use_taxon_filter:           true   
  use_frank_wolfe:            true   
  fw_top_k:                   5
  use_ising_model:            true   # Re-enabled: IsingBotanicalRepulsion active
  use_phenology:              true   # Re-enabled: ThermodynamicPhenology active
  use_geochem:                true   # Re-enabled: EIVEGeochemicalMask active
  use_retinex:                true   

output:
  species_mapping: "/workspace/plantclef/processed/species_ids_mapping.csv"
  submission_csv:  "submission_exg_god_tier.csv"
