# configs/high_res_dinov3.yaml
# ORACLE: High-Resolution DINOv3 Expert (512px, LoRA r=512)
# RTX PRO 6000 Blackwell (96GB VRAM × 3 GPUs)

architecture:
  resolution: 512
  bioclip_name: "hf-hub:imageomics/bioclip-2"
  dinov3_name: "vit_large_patch16_dinov3.lvd1689m"
  convnext_name: "convnextv2_large.fcmae_ft_in22k_in1k_384"
  use_retinex: true
  retinex_sigmas: [15.0, 80.0, 250.0]

hyperparameters:
  batch_size: 512
  p2_batch_size: 64        # Safe default for 512px LoRA; explicit so extreme_mode won't override
  accumulation_steps: 8    # Global batch = 64 × 3 GPUs × 8 = 1536
  epochs_p2: 8
  p2_samples_per_epoch: 1150000
  lr: 2e-5
  weight_decay: 0.05
  val_every_n_epochs: 1
  max_val_batches: 300
  swa_start_epoch: 6
  swa_lr: 0.000005

lora:
  r: 512
  alpha: 1024
  dropout: 0.05

research:
  use_swa: true
  use_compile: true
  use_flash_attn: true
  use_region_features: true
  use_fp8: true
  use_zero_shot: true
  zero_shot_weight: 0.1
  zero_shot_temp: 0.1

presets:
  rtx_6000_blackwell:
    hyperparameters:
      p2_batch_size: 64
      accumulation_steps: 8
    lora:
      r: 512
      alpha: 1024
  rtx_6000_blackwell_1x:
    hyperparameters:
      p2_batch_size: 64
      accumulation_steps: 24
    lora:
      r: 512
      alpha: 1024
  rtx_b200:
    hyperparameters:
      p2_batch_size: 128
      accumulation_steps: 12
    lora:
      r: 512
      alpha: 1024
  rtx_b300:
    hyperparameters:
      p2_batch_size: 192
      accumulation_steps: 8
    lora:
      r: 512
      alpha: 1024
