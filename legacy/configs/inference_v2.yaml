# Inference Pipeline
# Multi-resolution ensemble: each checkpoint runs at its native training
# resolution. Missing checkpoints are skipped automatically — set
# require_student: true to error out instead of falling back to teacher-only.

model:
  checkpoints:
    - path: "models/cuda_deep_sat/oracle_s9999/swa_model_final_ALIGNED.pth"
      resolution: 224                # student SWA
    - path: "models/cuda_deep_sat/expert_bioclip_512/swa_model_final_ALIGNED.pth"
      resolution: 224                # bioclip teacher
    - path: "models/cuda_deep_sat/expert_dinov3_512/swa_model_final_ALIGNED.pth"
      resolution: 224                # dinov3 teacher
    - path: "models/cuda_deep_sat/oracle_s1337/phase2_checkpoint_ep7_step_final_ALIGNED.pth"
      resolution: 448                # salvaged 448px specialist
  require_student: false
  num_classes:  7808
  resolution:   224                  # fallback for string-only entries (matches above)
  bioclip:      "hf-hub:imageomics/bioclip-2"
  dinov3:       "vit_large_patch16_dinov3.lvd1689m"
  convnext:     "convnextv2_large.fcmae_ft_in22k_in1k_384"

dataset:
  test_csv:  "/workspace/plantclef/kaggle_uploads/test/PlantCLEF2025_test.csv"
  img_dir:   "/workspace/plantclef/processed/test_images_jpeg85_max800"

tiling:
  enabled:    true
  tile_size:  224                      # match models' native resolution — no resize artifact
  overlap:    0.25                     # slightly more overlap at smaller tiles
  scales:     [1.0, 0.7, 0.5]

inference:
  batch_size:        16
  num_workers:       8
  aggregation:       "logsumexp"       # mean | max | logsumexp | conf_weighted
  disable_logit_standardization: true  # skip (logits-mean)/std at end of forward;
                                        # raw logits give better-calibrated sigmoid
  ensemble_weights:  [0.1, 0.2, 0.2, 0.5]   # student, bioclip_exp, dinov3_exp, s1337_salvaged
  use_ttt:           true              # Test-Time Adaptation
  ttt_steps:         10

postprocess:
  threshold:                  0.3      # global fallback (was 0.5 — too strict for standardized logits)
  top_k:                      5
  min_predictions:            1
  use_pav_isotonic:           true     # legacy flag (unused; kept for back-compat)

  # Advanced postprocessing chain — auto-disables per component if its data
  # files are missing (graceful degradation).
  use_pav_calibration:        true     # PAV-tree:        P(species)≤P(genus)≤P(family)
  use_taxon_filter:           true     # AC-3 (Rust):     zero impossible species per quadrat
  use_frank_wolfe:            true    # Frank-Wolfe:     richness-aware sparse selection
                                       # (off by default — replaces threshold/conformal/Brent
                                       #  paths; enable only after evaluating its impact)
  fw_top_k:                   5

  # Threshold strategies (mutually exclusive in priority: conformal > Brent > global)
  brent_thresholds_path:      "models/optimized_thresholds.json"
  conformal_calibration_path: "models/conformal_calibration.pt"
  conformal_alpha:            0.1      # 90% coverage target if conformal is loaded

  # Image preprocessing
  use_retinex:                true     # Multi-Scale Retinex: shadow / canopy-light flatten

  # SAM instance-mask tiling (replaces multi-scale grid tiling when enabled).
  # Slower (~1-2s per image on B200) but produces semantically meaningful crops
  # of individual plant instances rather than fixed-size patches.
  use_sam_tiling:             false
  sam_weights_path:           "models/sam_vit_h_4b8939.pth"
  sam_model_type:             "vit_h"
  sam_min_area:               2048      # px² floor — drops tiny noisy masks
  sam_max_instances:          16        # cap per image to bound runtime

  # FAISS retrieval-augmented classification — fires only when the model is
  # uncertain (max(prob) < faiss_low_conf_threshold). Boosts tail-species recall.
  use_faiss_retrieval:        true
  faiss_prototypes_path:      "models/species_prototypes.pt"
  faiss_alpha:                0.7       # final = α·logit + (1-α)·retrieval (lower α = more retrieval)
  faiss_low_conf_threshold:   0.3       # only mix retrieval if classifier is unsure

output:
  species_mapping: "/workspace/plantclef/processed/species_ids_mapping.csv"
  submission_csv:  "submission.csv"
