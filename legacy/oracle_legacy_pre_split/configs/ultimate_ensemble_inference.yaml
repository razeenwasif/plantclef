# PLANTCLEF: Ultimate God-Tier Ensemble (7 Models) - HYBRID WINNER RECIPE
# --------------------------------------------------
# Combines: 0.38 LB Giant, 0.37 LB Retrain, 0.36 LB (Exp 008)
# Plus: New 512px BioCLIP/DINO Specialists (Surgically Aligned & Merged)
# --------------------------------------------------

model:
  checkpoints:
    - path: "/workspace/working/best.pt"
      resolution: 512                # 0.38 LB Leader (Giant)
    - path: "/workspace/working/PlantCLEF2026/models/dinov3_plantnet_v2_retrain/phase_a_best.pth"
      resolution: 512                # 0.37 LB Retrain
    - path: "/workspace/working/PlantCLEF2026/models/dinov3_plantnet_v1_ddp/phase_b_best_ALIGNED.pth"
      resolution: 224                # 0.36 LB (Exp 008)
    - path: "models/cuda_deep_sat/expert_bioclip_512/epoch_ep2_final_MERGED.pth"
      resolution: 512                # New Specialist (Aligned + LoRA Merged)
    - path: "models/cuda_deep_sat/expert_dinov3_512/epoch_ep2_final_MERGED.pth"
      resolution: 512                # New Specialist (Aligned + LoRA Merged)
    - path: "models/cuda_deep_sat/plantclef_s1337/phase2_checkpoint_ep7_step_final_ALIGNED_V2.pth"
      resolution: 448                # Salvaged Specialist
    - path: "models/cuda_deep_sat/plantclef_s9999/swa_model_final_ALIGNED_V2.pth"
      resolution: 224                # Student Anchor

  num_classes:  7808
  resolution:   512
  bioclip:      "hf-hub:imageomics/bioclip-2"
  dinov3:       "vit_large_patch16_dinov3.lvd1689m"
  convnext:     "convnextv2_large.fcmae_ft_in22k_in1k_384"

dataset:
  test_csv:  "/workspace/plantclef/kaggle_uploads/test/PlantCLEF2025_test.csv"
  img_dir:   "/workspace/plantclef/processed/test_images_jpeg85_max800"

tiling:
  enabled:    true
  tile_size:  512
  overlap:    0.25                   # Increased overlap for better coverage
  scales:     [1.0, 0.7, 0.5]        # Multi-scale grid (Matches 0.36 recipe)

inference:
  batch_size:        64              # Reduced to 64 to accommodate HFlip TTA and 7 models
  num_workers:       16
  aggregation:       "logsumexp"
  disable_logit_standardization: true
  ensemble_weights:  [0.20, 0.20, 0.15, 0.15, 0.15, 0.10, 0.05]
  
  # Winner Recipe Features
  use_hflip_tta:     true            # Active: Mirror each tile and average
  use_ttt:           true            # Active: Test-Time Adaptation per quadrat
  ttt_steps:         10

postprocess:
  threshold:                  0.3
  top_k:                      5
  min_predictions:            1
  
  # Winner Recipe: Vegetation Filter
  min_vegetation_frac:        0.15   # Drop tiles with < 15% green pixels (dirt/rock filter)

  use_pav_calibration:        true   # P(species) ≤ P(genus)
  use_taxon_filter:           true   # AC-3 Consistency
  use_frank_wolfe:            true   # Biogeography Prior
  fw_top_k:                   5
  use_retinex:                true   # Shadow/Light Normalization
  
  use_faiss_retrieval:        false

output:
  species_mapping: "/workspace/plantclef/processed/species_ids_mapping.csv"
  submission_csv:  "submission_ultimate_god_tier.csv"
