paths:
  test_csv: /workspace/plantclef/processed/experiment_quadrats.csv
  image_dir: /workspace/plantclef/raw/train/images_max_side_800/
  species_csv: /workspace/plantclef/processed/species_ids_mapping.csv
  output_dir: /workspace/plantclef/outputs/experiment/
  checkpoint_paths:
    - /workspace/PlantCLEF2026/models/best_calibrated/mp_rank_00_model_states.pt

tiling:
  tile_size: 512
  stride:    384
  scales:    [1.0]

filter:
