# PLANTCLEF Champion Consensus Config
# ------------------------------
# Targeted score: 0.40+ LB
# ------------------------------

model:
  checkpoints:
    - path: "/workspace/scratch_space_arjun/PlantCLEF2026/src_experiments/010_bioclip25_end_to_end_finetune_multitask/outputs/last_blocks_8/checkpoints/best.pt"
      resolution: 512

  num_classes:  7806
  resolution:   512

dataset:
  test_csv:  "/workspace/plantclef/kaggle_uploads/test/PlantCLEF2025_test.csv"
  img_dir:   "/workspace/plantclef/processed/test_images_jpeg85_max800"

tiling:
  enabled:    true
  tile_size:  512
  overlap:    0.25
  scales:     [1.0, 0.8]

inference:
  batch_size:        64
  num_workers:       16
  aggregation:       "bayesian_veg"
  disable_logit_standardization: false # Consensus Mode
  
  use_hflip_tta:     true
  use_ttt:           false # Stable Mode

postprocess:
  threshold:                  0.3
  top_k:                      10
  min_predictions:            1
  min_vegetation_frac:        0.15

  use_pav_calibration:        true
  use_taxon_filter:           true
  use_frank_wolfe:            true
  use_ising_model:            true
  use_phenology:              true
  use_geochem:                true
  fw_top_k:                   5

output:
  species_mapping: "/workspace/plantclef/processed/species_ids_mapping.csv"
  submission_csv:  "submissions/submission_champion_consensus.csv"
