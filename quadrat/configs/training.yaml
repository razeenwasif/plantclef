# PlantCLEF 2026 - Deep Saturation Configuration
# -------------------------------------------

# Presets for hardware switching
presets:
  rtx_6000_blackwell:
    hyperparameters:
      batch_size: 2048
      p2_batch_size: 1280
    lora:
      r: 512
      alpha: 1024
    memory:
      extract_chunk_size: 256
      chunk_size: 160
      p2_chunk_size: 40
  rtx_6000_blackwell_1x:
    hyperparameters:
      batch_size: 2048
      p2_batch_size: 1280
      accumulation_steps: 12
    lora:
      r: 512
      alpha: 1024
    memory:
      extract_chunk_size: 256
      chunk_size: 160
      p2_chunk_size: 40
  rtx_b200:
    hyperparameters:
      batch_size: 4096
      p2_batch_size: 2560
      accumulation_steps: 6
    lora:
      r: 512
      alpha: 1024
    memory:
      extract_chunk_size: 512
      chunk_size: 320
      p2_chunk_size: 80
  rtx_b300:
    hyperparameters:
      batch_size: 6144
      p2_batch_size: 3840
      accumulation_steps: 4
    lora:
      r: 512
      alpha: 1024
    memory:
      extract_chunk_size: 768
      chunk_size: 480
      p2_chunk_size: 120
  rtx_pro_6000:
    hyperparameters:
      batch_size: 1024
      p2_batch_size: 128
    lora:
      r: 512
      alpha: 1024
    memory:
      extract_chunk_size: 64
      chunk_size: 32
      p2_chunk_size: 8
  two_5090s:
    hyperparameters:
      batch_size: 1024
      p2_batch_size: 224
    lora:
      r: 512
      alpha: 1024
    memory:
      extract_chunk_size: 128
      chunk_size: 64
      p2_chunk_size: 16

dataset:
  mode: "plantclef"
  plantclef:
    raw_csv: "/workspace/plantclef/raw/PlantCLEF2024_single_plant_training_metadata.csv"
    img_dir: "/workspace/plantclef/raw/train/images_max_side_800/"
    cleaned_csv: "/workspace/plantclef/processed/student_train_final.csv"
  kaggle_test:
    raw_csv: "/workspace/plantclef/processed/kaggle_test_metadata.csv"
    img_dir: "/workspace/plantclef/raw/test/data/PlantCLEF/PlantCLEF2025/DataOut/test/package/images/"
    cleaned_csv: "/workspace/plantclef/processed/kaggle_test_metadata_cleaned.csv"

architecture:
  resolution: 224
  bioclip_name: "hf-hub:imageomics/bioclip-2"
  dinov3_name: "vit_large_patch16_dinov3.lvd1689m"
  convnext_name: "convnextv2_large.fcmae_ft_in22k_in1k_384"
  use_retinex: true
  retinex_sigmas: [15.0, 80.0, 250.0]

hyperparameters:
  batch_size: 1024
  p2_batch_size: 1280
  num_threads: 16
  accumulation_steps: 1
  epochs_p1: 100
  epochs_p2: 10
  p2_samples_per_epoch: 1150000
  patience: 12
  val_every_n_epochs: 3
  max_val_batches: 200

lora:
  r: 512
  alpha: 1024
  dropout: 0.05

memory:
  extract_chunk_size: 64
  chunk_size: 32
  p2_chunk_size: 8

research:
  use_region_features: false
  pca_components: 1024
  sampling_mode: "natural"
  use_swa: true
  swa_start_epoch: 1
  swa_lr: 0.00001
  use_trait_distillation: true
  kd_alpha: 0.3
  use_zero_shot: true
  zero_shot_weight: 0.1
  zero_shot_temp: 0.1
  use_compile: true
  use_flash_attn: true
